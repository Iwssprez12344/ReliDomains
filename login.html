<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — ReliDomains</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-box">
<a href="index.html" class="logo">Reli<span>Domains</span></a>

<div id="login-content">
<h1>Welcome back</h1>
<p>Connect your GitHub account to continue.</p>

<button class="github-login" onclick="githubLogin()">
Continue with GitHub
</button>

<a href="index.html" class="back">← Back to ReliDomains</a>
</div>

<div id="callback-content" style="display:none">
<h1>Signing you in</h1>
<p>Connecting to your GitHub account...</p>
</div>

<div id="error-content" style="display:none">
<h1>Something went wrong</h1>
<p id="error-message">GitHub authentication failed.</p>
<a href="login.html" class="button primary">Try again</a>
</div>
</div>

<script src="js/app.js"></script>
</body>
</html>
